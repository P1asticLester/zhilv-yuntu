# 4c · 推代码时自动跑后端测试 + 覆盖率门禁
#
# 前置：4a 的 backend/tests/conftest.py 已统一 Mock LLM / 高德 / Chroma，
#       干净机器没有 .env、没有密钥、不通外网也能跑完 92 个测试。
# 门禁阈值 65：本机（Python 3.13.2 / backend\.venv）实测 69%，留 4pp 余量；
#              以后补了测试要同步上调，别把阈值当成绩单。
# 本文件是 4c 的唯一产物：pytest-cov 在 CI 里单独安装，不改 requirements.txt。
#
# 本地复现（PowerShell）：
#   cd "D:/zhilv-yuntu/backend"
#   & "./.venv/Scripts/python.exe" -m pip install "pytest-cov>=5,<7"
#   & "./.venv/Scripts/python.exe" -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=65
#
# 注意：只有 push 到 GitHub 之后才会真正出现绿勾；本地跑不算 CI 通过。

name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest-cov>=5,<7"

      - name: Run pytest with coverage gate
        # term-missing 会把「哪些行没被覆盖」直接打在 CI 日志里。
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=65
