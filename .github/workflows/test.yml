# 4c · 推代码时自动跑后端测试 + 覆盖率门禁
#
# 前置：4a 的 backend/tests/conftest.py 已统一 Mock LLM / 高德 / Chroma，
#       干净机器没有 .env、没有密钥、不通外网也能跑完 139 个测试。
# 门禁阈值 65：定阈值时本机（Python 3.13.2 / backend\.venv）实测 69.23%，
#              留 4pp 余量；补测试后当前为 139 passed / 73.83%，余量 8.83pp。
#              以后补了测试要同步上调，别把阈值当成绩单。
# 本文件是 4c 的唯一产物：pytest-cov 在 CI 里单独安装，不改 requirements.txt。
#
# 本地复现（PowerShell）：
#   cd "D:/zhilv-yuntu/backend"
#   & "./.venv/Scripts/python.exe" -m pip install "pytest-cov>=5,<7" "allure-pytest>=2.13,<3" "pytest-html>=4.2,<5"
#   & "./.venv/Scripts/python.exe" -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=65 \
#       --alluredir=allure-results --html=report.html --self-contained-html
#
# Allure（Step 3）：与 pytest-cov 一样由 CI 单独安装，不改 requirements.txt。
# 跑测试时写 allure-results/ 并上传为 artifact；--cov-fail-under=65 与 pytest
# 的 exit code 仍是唯一的失败判定，上传步骤不改变绿勾/红叉。
# 本地复现报告产物：
#   & "./.venv/Scripts/python.exe" -m pytest --alluredir=allure-results
#   allure generate allure-results -o allure-report --clean
# 本机若没装 Allure CLI，allure-results/ 产物 + 上面这条命令就是最低交付。
#
# pytest-html（11-15 补）：与 Allure **并存**，额外产出自包含单文件 HTML，
# 不需要 Java / Allure CLI，双击即可查看；CI 上传为独立 artifact。
# 本地：& "./.venv/Scripts/python.exe" -m pytest --html=report.html --self-contained-html
# 注意报告里会包含测试捕获的 stdout，别把密钥值打进日志。
#
# 注意：只有 push 到 GitHub 之后才会真正出现绿勾；本地跑不算 CI 通过。

name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest-cov>=5,<7"
          python -m pip install "allure-pytest>=2.13,<3"
          python -m pip install "pytest-html>=4.2,<5"

      - name: Run pytest with coverage gate
        # term-missing 会把「哪些行没被覆盖」直接打在 CI 日志里。
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=65
          --alluredir=allure-results
          --html=report.html
          --self-contained-html

      - name: Upload Allure results
        # always() 只为失败时也能拿到结果排查；不改变本 job 的成功/失败判定。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: backend/allure-results
          if-no-files-found: ignore

      - name: Upload self-contained HTML report
        # pytest-html 产单文件报告，双击即可查看；同样不改变失败判定。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/report.html
          if-no-files-found: ignore
